<!doctype html>
<html lang="en" data-mode="dark" data-motion="subtle" data-hero="wide">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Harshit Suri — Technical product builder</title>
    <meta name="description" content="Harshit Suri — computer science at USF. Building AI-native products, internal tools, and operational systems that reduce friction." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&family=Inter+Tight:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,wght@0,400;1,400&display=swap"
      rel="stylesheet"
    />
    <style>
/* ============================================================
   harshitsuri.com — design tokens + base
   ============================================================ */

:root {
  /* dark (default) — warm near-black */
  --bg: #0a0a0b;
  --bg-elev: #111113;
  --ink: #ededeb;
  --ink-dim: #a3a39d;
  --ink-faint: #65655f;
  --ink-ghost: #2a2a28;
  --rule: #1c1c1b;
  --rule-strong: #2a2a28;
  --accent: oklch(0.78 0.06 75);     /* sand */
  --accent-soft: oklch(0.78 0.06 75 / 0.14);
  --selection: oklch(0.78 0.06 75 / 0.30);

  --font-sans: "Geist", "Inter", -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;
  --font-mono: "Geist Mono", "JetBrains Mono", "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --font-serif: "Newsreader", "Iowan Old Style", "Source Serif Pro", Georgia, serif;

  /* motion */
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
  --motion-scale: 1;

  /* layout */
  --gutter: clamp(20px, 4vw, 64px);
  --max-w: 1440px;
  --col-w: 1180px;
}

[data-mode="light"] {
  --bg: #f5f3ee;
  --bg-elev: #ecebe5;
  --ink: #15151a;
  --ink-dim: #56564f;
  --ink-faint: #8a8a7f;
  --ink-ghost: #d4d2cb;
  --rule: #e0ddd4;
  --rule-strong: #c9c6bc;
  --accent: oklch(0.55 0.08 65);
  --accent-soft: oklch(0.55 0.08 65 / 0.12);
  --selection: oklch(0.55 0.08 65 / 0.25);
}

/* ============================================================
   reset
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
html {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-sans);
  font-feature-settings: "ss01", "ss02", "cv11";
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  scroll-behavior: smooth;
}
body {
  min-height: 100vh;
  overflow-x: hidden;
  font-size: 16px;
  line-height: 1.5;
  letter-spacing: -0.005em;
  transition: background-color 0.6s var(--ease-out), color 0.6s var(--ease-out);
}
::selection { background: var(--selection); color: var(--ink); }
a { color: inherit; text-decoration: none; }
button { background: none; border: none; color: inherit; font: inherit; cursor: pointer; padding: 0; }
img, svg { display: block; max-width: 100%; }

/* ============================================================
   layout primitives
   ============================================================ */
.container {
  width: 100%;
  max-width: var(--max-w);
  margin: 0 auto;
  padding: 0 var(--gutter);
}
.col {
  width: 100%;
  max-width: var(--col-w);
  margin: 0 auto;
  padding: 0 var(--gutter);
}

.rule {
  height: 1px;
  background: var(--rule);
  width: 100%;
}

/* ============================================================
   type
   ============================================================ */
.mono {
  font-family: var(--font-mono);
  font-feature-settings: "ss01", "ss02";
  letter-spacing: 0;
}

.eyebrow {
  font-family: var(--font-mono);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--ink-faint);
  font-weight: 400;
}

.display {
  font-weight: 500;
  letter-spacing: -0.035em;
  line-height: 0.92;
  font-size: clamp(64px, 13vw, 196px);
  margin: 0;
}

.h-section {
  font-weight: 500;
  letter-spacing: -0.025em;
  line-height: 0.98;
  font-size: clamp(40px, 6.5vw, 92px);
  margin: 0;
}

.h-2 {
  font-weight: 500;
  letter-spacing: -0.02em;
  line-height: 1.05;
  font-size: clamp(28px, 3.5vw, 44px);
  margin: 0;
}

.lead {
  font-size: clamp(18px, 1.7vw, 24px);
  line-height: 1.45;
  letter-spacing: -0.01em;
  color: var(--ink-dim);
  font-weight: 400;
  max-width: 56ch;
}

.body {
  font-size: 15px;
  line-height: 1.6;
  color: var(--ink-dim);
}

/* ============================================================
   chrome — nav
   ============================================================ */
.nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 50;
  padding: 18px var(--gutter);
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: color-mix(in oklab, var(--bg) 70%, transparent);
  backdrop-filter: blur(20px) saturate(140%);
  -webkit-backdrop-filter: blur(20px) saturate(140%);
  border-bottom: 1px solid transparent;
  transition: border-color 0.4s var(--ease-out), padding 0.4s var(--ease-out);
}
.nav[data-scrolled="true"] {
  border-bottom-color: var(--rule);
  padding-top: 12px;
  padding-bottom: 12px;
}
.nav-brand {
  font-family: var(--font-mono);
  font-size: 13px;
  letter-spacing: -0.005em;
  display: inline-flex;
  align-items: center;
  gap: 10px;
}
.nav-brand .dot {
  width: 6px; height: 6px; border-radius: 99px;
  background: var(--accent);
  box-shadow: 0 0 10px var(--accent);
  animation: pulse 2.4s var(--ease-in-out) infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.55; transform: scale(0.85); }
}
.nav-links {
  display: flex;
  gap: 28px;
  align-items: center;
}
.nav-link {
  font-family: var(--font-mono);
  font-size: 12.5px;
  color: var(--ink-dim);
  position: relative;
  padding: 6px 0;
  transition: color 0.3s var(--ease-out);
}
.nav-link:hover { color: var(--ink); }
.nav-link::after {
  content: "";
  position: absolute;
  bottom: 2px; left: 0;
  width: 0; height: 1px;
  background: var(--ink);
  transition: width 0.4s var(--ease-out);
}
.nav-link:hover::after { width: 100%; }
.nav-cta {
  font-family: var(--font-mono);
  font-size: 12.5px;
  padding: 8px 14px;
  border: 1px solid var(--rule-strong);
  border-radius: 999px;
  color: var(--ink);
  transition: background-color 0.3s var(--ease-out), color 0.3s var(--ease-out), border-color 0.3s var(--ease-out);
  transform: translate(var(--mag-x, 0px), var(--mag-y, 0px));
  will-change: transform;
}
.nav-cta:hover {
  background: var(--ink);
  color: var(--bg);
  border-color: var(--ink);
}

/* ============================================================
   hero
   ============================================================ */
.hero {
  position: relative;
  min-height: 100vh;
  padding: clamp(120px, 18vh, 200px) 0 100px;
  overflow: hidden;
}
.hero-grid {
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(to right, var(--rule) 1px, transparent 1px),
    linear-gradient(to bottom, var(--rule) 1px, transparent 1px);
  background-size: 88px 88px;
  background-position: center;
  mask-image: radial-gradient(ellipse at center, black 10%, transparent 70%);
  -webkit-mask-image: radial-gradient(ellipse at center, black 10%, transparent 70%);
  opacity: 0.5;
  pointer-events: none;
}
.hero-vignette {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: radial-gradient(circle 400px at var(--mx, 50%) var(--my, 40%),
    oklch(0.78 0.06 75 / 0.06) 0%,
    transparent 60%);
  transition: opacity 0.6s var(--ease-out);
}

.hero-meta {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: clamp(60px, 10vh, 120px);
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--ink-faint);
  letter-spacing: 0.02em;
  flex-wrap: wrap;
  gap: 12px;
}
.hero-meta b { color: var(--ink-dim); font-weight: 400; }

.hero-name {
  position: relative;
}
.hero-name .word {
  display: inline-block;
  overflow: hidden;
  vertical-align: bottom;
}
.hero-name .letter {
  display: inline-block;
  transform: translateY(110%);
  animation: revealLetter 1.1s var(--ease-out) forwards;
  animation-delay: var(--d, 0ms);
}
@keyframes revealLetter {
  to { transform: translateY(0); }
}
.hero-name .ampersand {
  color: var(--accent);
  font-family: var(--font-serif);
  font-style: italic;
  font-weight: 400;
}

.hero-tagline {
  margin-top: clamp(40px, 6vh, 72px);
  max-width: 720px;
  font-size: clamp(20px, 2vw, 28px);
  line-height: 1.35;
  letter-spacing: -0.015em;
  color: var(--ink);
  font-weight: 400;
  opacity: 0;
  transform: translateY(20px);
  animation: fadeUp 1.4s var(--ease-out) 0.9s forwards;
}
.hero-tagline em {
  font-family: var(--font-serif);
  font-style: italic;
  font-weight: 400;
  color: var(--accent);
}
.hero-tagline .secondary { color: var(--ink-dim); }

@keyframes fadeUp {
  to { opacity: 1; transform: translateY(0); }
}

.hero-foot {
  position: absolute;
  bottom: 40px;
  left: 0; right: 0;
  display: flex;
  justify-content: space-between;
  align-items: end;
  padding: 0 var(--gutter);
  font-family: var(--font-mono);
  font-size: 11.5px;
  color: var(--ink-faint);
  letter-spacing: 0.02em;
  opacity: 0;
  animation: fadeUp 1.4s var(--ease-out) 1.4s forwards;
}
.hero-foot .now {
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
.hero-foot .now-dot {
  width: 6px; height: 6px; border-radius: 99px;
  background: var(--accent);
  animation: pulse 2.4s var(--ease-in-out) infinite;
}
.hero-foot .scroll-cue {
  display: inline-flex;
  align-items: center;
  gap: 10px;
}
.hero-foot .scroll-cue .line {
  display: inline-block;
  width: 32px; height: 1px;
  background: var(--ink-faint);
  position: relative;
  overflow: hidden;
}
.hero-foot .scroll-cue .line::after {
  content: "";
  position: absolute;
  inset: 0;
  background: var(--ink);
  transform: translateX(-100%);
  animation: scrollSlide 2.6s var(--ease-in-out) infinite;
}
@keyframes scrollSlide {
  0% { transform: translateX(-100%); }
  50% { transform: translateX(0); }
  100% { transform: translateX(100%); }
}

/* ============================================================
   section header
   ============================================================ */
.section {
  padding: clamp(100px, 14vh, 160px) 0;
  position: relative;
}
.section-head {
  display: grid;
  grid-template-columns: 1fr;
  gap: 32px;
  margin-bottom: clamp(60px, 8vh, 96px);
}
@media (min-width: 900px) {
  .section-head {
    grid-template-columns: 1fr 1.6fr;
    align-items: end;
  }
}
.section-head .label {
  display: flex;
  align-items: baseline;
  gap: 12px;
}
.section-head .label .num {
  color: var(--ink-faint);
}

/* ============================================================
   work — editorial list
   ============================================================ */
.work-list {
  display: flex;
  flex-direction: column;
  border-top: 1px solid var(--rule);
}
.work-item {
  display: grid;
  grid-template-columns: 56px 1fr;
  gap: 24px;
  padding: clamp(28px, 4vh, 44px) 0;
  border-bottom: 1px solid var(--rule);
  position: relative;
  cursor: pointer;
  transition: padding 0.5s var(--ease-out);
}
@media (min-width: 900px) {
  .work-item {
    grid-template-columns: 64px 1.4fr 1.4fr 1fr 90px;
    align-items: center;
    gap: 32px;
  }
}
.work-item .idx {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--ink-faint);
  align-self: start;
  padding-top: 6px;
}
.work-item .title {
  font-size: clamp(28px, 3.4vw, 48px);
  font-weight: 500;
  letter-spacing: -0.025em;
  line-height: 1;
  color: var(--ink);
  transition: transform 0.6s var(--ease-out), color 0.4s var(--ease-out);
}
.work-item .title em {
  font-family: var(--font-serif);
  font-style: italic;
  font-weight: 400;
  color: var(--accent);
}
.work-item .blurb {
  font-size: 15px;
  line-height: 1.5;
  color: var(--ink-dim);
  max-width: 38ch;
}
.work-item .meta-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 10px;
}
@media (min-width: 900px) {
  .work-item .meta-row { margin-top: 0; }
}
.work-item .tag {
  font-family: var(--font-mono);
  font-size: 10.5px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  padding: 4px 8px;
  border: 1px solid var(--rule-strong);
  border-radius: 999px;
  color: var(--ink-dim);
}
.work-item .year {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--ink-faint);
  text-align: right;
  align-self: center;
}
.work-item .arrow {
  position: absolute;
  right: 0;
  top: 50%;
  transform: translate(var(--mag-x, 0px), calc(-50% + var(--mag-y, 0px)));
  opacity: 0;
  transition: opacity 0.5s var(--ease-out);
  font-family: var(--font-mono);
  color: var(--accent);
  font-size: 18px;
  will-change: transform;
}
.work-item:hover .title {
  transform: translateX(calc(12px * var(--motion-scale)));
}
.work-item:hover .arrow {
  opacity: 1;
}
.work-item:hover { background: linear-gradient(to right, var(--accent-soft), transparent 60%); }

/* ============================================================
   experience timeline
   ============================================================ */
.exp-list {
  display: flex;
  flex-direction: column;
}
.exp-row {
  display: grid;
  grid-template-columns: 1fr;
  gap: 16px;
  padding: clamp(28px, 4vh, 44px) 0;
  border-top: 1px solid var(--rule);
}
.exp-row:last-child { border-bottom: 1px solid var(--rule); }
@media (min-width: 900px) {
  .exp-row {
    grid-template-columns: 120px 1.2fr 2fr;
    gap: 48px;
    align-items: start;
  }
}
.exp-when {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--ink-faint);
  letter-spacing: 0.02em;
}
.exp-org {
  font-size: clamp(22px, 2.2vw, 28px);
  font-weight: 500;
  letter-spacing: -0.02em;
  color: var(--ink);
}
.exp-role {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--ink-faint);
  margin-top: 6px;
  letter-spacing: 0.02em;
}
.exp-body {
  font-size: 16px;
  line-height: 1.55;
  color: var(--ink-dim);
  max-width: 52ch;
}

/* ============================================================
   philosophy
   ============================================================ */
.philosophy {
  background: var(--bg-elev);
  border-top: 1px solid var(--rule);
  border-bottom: 1px solid var(--rule);
}
.pullquote {
  font-size: clamp(28px, 4.2vw, 56px);
  line-height: 1.15;
  letter-spacing: -0.02em;
  font-weight: 400;
  max-width: 22ch;
  color: var(--ink);
}
.pullquote em {
  font-family: var(--font-serif);
  font-style: italic;
  color: var(--accent);
  font-weight: 400;
}
.principles {
  display: grid;
  gap: 28px;
  grid-template-columns: 1fr;
  margin-top: clamp(48px, 8vh, 88px);
}
@media (min-width: 700px) {
  .principles { grid-template-columns: repeat(2, 1fr); }
}
@media (min-width: 1100px) {
  .principles { grid-template-columns: repeat(4, 1fr); }
}
.principle {
  border-top: 1px solid var(--rule-strong);
  padding-top: 18px;
}
.principle .num {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--accent);
  letter-spacing: 0.06em;
}
.principle .name {
  font-size: 18px;
  font-weight: 500;
  letter-spacing: -0.01em;
  margin: 8px 0 6px;
}
.principle .desc {
  font-size: 14px;
  color: var(--ink-dim);
  line-height: 1.55;
}

/* ============================================================
   contact
   ============================================================ */
.contact {
  padding: clamp(120px, 18vh, 200px) 0 80px;
  position: relative;
}
.contact-eyebrow {
  margin-bottom: clamp(40px, 6vh, 64px);
}
.contact-line {
  font-size: clamp(40px, 7vw, 120px);
  font-weight: 500;
  letter-spacing: -0.035em;
  line-height: 1;
  margin: 0;
  color: var(--ink);
}
.contact-line em {
  font-family: var(--font-serif);
  font-style: italic;
  font-weight: 400;
  color: var(--accent);
}
.contact-email {
  margin-top: clamp(40px, 6vh, 72px);
  display: inline-block;
  font-size: clamp(28px, 4vw, 56px);
  font-weight: 500;
  letter-spacing: -0.025em;
  position: relative;
  color: var(--ink);
  transform: translate(var(--mag-x, 0px), var(--mag-y, 0px));
  will-change: transform;
}
.contact-email::after {
  content: "";
  position: absolute;
  left: 0; bottom: 0.05em;
  width: 0; height: 2px;
  background: var(--accent);
  transition: width 0.6s var(--ease-out);
}
.contact-email:hover::after { width: 100%; }

.contact-socials {
  margin-top: clamp(48px, 8vh, 80px);
  display: flex;
  gap: clamp(20px, 4vw, 48px);
  flex-wrap: wrap;
  font-family: var(--font-mono);
  font-size: 13px;
}
.contact-socials a {
  color: var(--ink-dim);
  display: inline-flex;
  align-items: center;
  gap: 8px;
  transition: color 0.3s var(--ease-out);
}
.contact-socials a::before {
  content: "↗";
  font-size: 12px;
  color: var(--ink-faint);
  transition: transform 0.4s var(--ease-out), color 0.3s var(--ease-out);
}
.contact-socials a:hover { color: var(--ink); }
.contact-socials a:hover::before {
  transform: translate(2px, -2px);
  color: var(--accent);
}

/* ============================================================
   footer
   ============================================================ */
.footer {
  border-top: 1px solid var(--rule);
  padding: 40px 0 36px;
  font-family: var(--font-mono);
  font-size: 11.5px;
  color: var(--ink-faint);
  letter-spacing: 0.02em;
}
.footer-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 24px;
  flex-wrap: wrap;
}

/* ============================================================
   reveal on scroll
   ============================================================ */
.reveal {
  opacity: 0;
  transform: translateY(calc(30px * var(--motion-scale)));
  transition: opacity 1s var(--ease-out), transform 1s var(--ease-out);
}
.reveal.in {
  opacity: 1;
  transform: translateY(0);
}

/* motion off */
[data-motion="off"] .reveal,
[data-motion="off"] .hero-tagline,
[data-motion="off"] .hero-foot,
[data-motion="off"] .hero-name .letter {
  animation: none !important;
  transition: none !important;
  opacity: 1 !important;
  transform: none !important;
}
[data-motion="off"] .hero-grid,
[data-motion="off"] .hero-vignette { display: none; }
[data-motion="off"] .nav-brand .dot,
[data-motion="off"] .hero-foot .now-dot { animation: none; }

/* layout variants */
[data-hero="left"] .hero-meta { justify-content: flex-start; gap: 48px; }
[data-hero="left"] .hero-name { text-align: left; }
[data-hero="center"] .hero-name { text-align: center; }
[data-hero="center"] .hero-tagline { margin-left: auto; margin-right: auto; text-align: center; }
[data-hero="center"] .hero-meta { justify-content: center; gap: 24px; flex-wrap: wrap; }

/* ============================================================
   tablet (<= 900px) — relaxing chrome
   ============================================================ */
@media (max-width: 900px) {
  :root { --gutter: clamp(20px, 5vw, 40px); }
  .nav { padding: 14px var(--gutter); }
  .nav-link { font-size: 12px; }
  .nav-links { gap: 18px; }
  .section { padding: clamp(80px, 12vh, 120px) 0; }
}

/* ============================================================
   mobile (<= 700px) — single column, stacked, no horiz scroll
   ============================================================ */
@media (max-width: 700px) {
  :root { --gutter: 22px; }
  html { font-size: 15px; }

  /* nav */
  .nav { padding: 12px var(--gutter); }
  .nav-links { display: none; }
  .nav-cta { padding: 7px 12px; font-size: 12px; }

  /* hero */
  .hero {
    min-height: auto;
    padding: 110px 0 56px;
  }
  .hero-meta {
    flex-direction: column;
    align-items: flex-start;
    gap: 6px;
    margin-bottom: 56px;

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-omelette-chrome=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

// app.jsx — orchestrator
const { useEffect: useEff, useState: useSt, useRef: useRf } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "mode": "dark",
  "accentName": "Sand",
  "accentH": 75,
  "typePair": "Geist",
  "motion": "subtle",
  "heroLayout": "wide"
}/*EDITMODE-END*/;

const ACCENTS = [
  { name: "Sand", h: 75 },
  { name: "Ember", h: 40 },
  { name: "Mono", h: 75, mono: true },
  { name: "Arc", h: 250 },
  { name: "Moss", h: 145 },
];

const TYPE_PAIRS = {
  Geist: {
    sans: '"Geist", "Inter", system-ui, sans-serif',
    mono: '"Geist Mono", ui-monospace, monospace',
    serif: '"Newsreader", Georgia, serif',
  },
  Inter: {
    sans: '"Inter Tight", "Inter", system-ui, sans-serif',
    mono: '"JetBrains Mono", ui-monospace, monospace',
    serif: '"Newsreader", Georgia, serif',
  },
  Editorial: {
    sans: '"Instrument Sans", "Inter", system-ui, sans-serif',
    mono: '"IBM Plex Mono", ui-monospace, monospace',
    serif: '"Instrument Serif", Georgia, serif',
  },
};

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

  // attach mode + motion + hero variant to root
  useEff(() => {
    document.documentElement.setAttribute("data-mode", t.mode);
    document.documentElement.setAttribute("data-motion", t.motion);
    document.documentElement.setAttribute("data-hero", t.heroLayout);

    // accent — set CSS vars
    const root = document.documentElement.style;
    const accent = ACCENTS.find((a) => a.name === t.accentName) || ACCENTS[0];
    if (accent.mono) {
      root.setProperty(
        "--accent",
        t.mode === "dark" ? "#ededeb" : "#15151a"
      );
      root.setProperty(
        "--accent-soft",
        t.mode === "dark" ? "rgba(237,237,235,0.10)" : "rgba(21,21,26,0.08)"
      );
    } else {
      const L = t.mode === "dark" ? 0.78 : 0.55;
      const C = t.mode === "dark" ? 0.06 : 0.08;
      root.setProperty("--accent", `oklch(${L} ${C} ${accent.h})`);
      root.setProperty(
        "--accent-soft",
        `oklch(${L} ${C} ${accent.h} / 0.14)`
      );
    }

    // typeface
    const pair = TYPE_PAIRS[t.typePair];
    root.setProperty("--font-sans", pair.sans);
    root.setProperty("--font-mono", pair.mono);
    root.setProperty("--font-serif", pair.serif);

    // motion scale
    root.setProperty(
      "--motion-scale",
      t.motion === "off" ? "0" : t.motion === "subtle" ? "1" : "1.6"
    );
  }, [t.mode, t.motion, t.heroLayout, t.accentName, t.typePair]);

  // scroll-driven nav
  const [scrolled, setScrolled] = useSt(false);
  useEff(() => {
    const onScroll = () => setScrolled(window.scrollY > 24);
    window.addEventListener("scroll", onScroll, { passive: true });
    return () => window.removeEventListener("scroll", onScroll);
  }, []);

  // reveal-on-scroll
  useEff(() => {
    if (t.motion === "off") {
      document.querySelectorAll(".reveal").forEach((el) => el.classList.add("in"));
      return;
    }
    const io = new IntersectionObserver(
      (entries) => {
        entries.forEach((e) => {
          if (e.isIntersecting) {
            e.target.classList.add("in");
            io.unobserve(e.target);
          }
        });
      },
      { threshold: 0.12, rootMargin: "0px 0px -10% 0px" }
    );
    document.querySelectorAll(".reveal").forEach((el) => io.observe(el));
    return () => io.disconnect();
  }, [t.motion]);

  // magnetic CTAs — pull elements toward cursor when within radius
  useEff(() => {
    if (t.motion === "off") return;
    const els = Array.from(document.querySelectorAll("[data-magnetic]"));
    if (!els.length) return;
    const state = els.map((el) => ({
      el,
      x: 0,
      y: 0,
      tx: 0,
      ty: 0,
      radius: parseFloat(el.dataset.magRadius || "100"),
      strength: parseFloat(el.dataset.magStrength || "0.32"),
      max: parseFloat(el.dataset.magMax || "10"),
    }));
    let mx = -99999, my = -99999;
    const onMove = (e) => { mx = e.clientX; my = e.clientY; };
    const onLeave = () => { mx = -99999; my = -99999; };
    window.addEventListener("mousemove", onMove, { passive: true });
    window.addEventListener("mouseleave", onLeave);

    let raf;
    const tick = () => {
      for (const s of state) {
        const r = s.el.getBoundingClientRect();
        const cx = r.left + r.width / 2;
        const cy = r.top + r.height / 2;
        const dx = mx - cx;
        const dy = my - cy;
        const d = Math.hypot(dx, dy);
        let tx = 0, ty = 0;
        if (d < s.radius) {
          const force = 1 - d / s.radius;
          tx = Math.max(-s.max, Math.min(s.max, dx * s.strength * force));
          ty = Math.max(-s.max, Math.min(s.max, dy * s.strength * force));
        }
        s.x += (tx - s.x) * 0.2;
        s.y += (ty - s.y) * 0.2;
        if (Math.abs(s.x) < 0.05 && Math.abs(s.y) < 0.05) {
          s.x = 0; s.y = 0;
        }
        s.el.style.setProperty("--mag-x", s.x.toFixed(2) + "px");
        s.el.style.setProperty("--mag-y", s.y.toFixed(2) + "px");
      }
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);

    return () => {
      window.removeEventListener("mousemove", onMove);
      window.removeEventListener("mouseleave", onLeave);
      cancelAnimationFrame(raf);
      state.forEach((s) => {
        s.el.style.removeProperty("--mag-x");
        s.el.style.removeProperty("--mag-y");
      });
    };
  }, [t.motion]);

  // tweaks panel open state (mirror from host protocol messages)
  const [tweaksOpen, setTweaksOpen] = useSt(false);
  useEff(() => {
    const onMsg = (e) => {
      const ty = e?.data?.type;
      if (ty === "__activate_edit_mode") setTweaksOpen(true);
      else if (ty === "__deactivate_edit_mode" || ty === "__edit_mode_dismissed")
        setTweaksOpen(false);
    };
    window.addEventListener("message", onMsg);
    return () => window.removeEventListener("message", onMsg);
  }, []);
  const openTweaks = () => {
    window.postMessage({ type: "__activate_edit_mode" }, "*");
  };

  return (
    <>
      <nav className="nav" data-scrolled={scrolled}>
        <a href="#top" className="nav-brand">
          <span className="dot" />
          <span>harshit suri</span>
        </a>
        <div className="nav-links">
          <a className="nav-link" href="#work">work</a>
          <a className="nav-link" href="#experience">experience</a>
          <a className="nav-link" href="#about">about</a>
          <a className="nav-link" href="/resume.pdf" target="_blank" rel="noreferrer">resume</a>
          <a className="nav-cta" href="#contact" data-magnetic data-mag-radius="110">say hello →</a>
        </div>
      </nav>

      <Hero accent={t.accentName} hero={t.heroLayout} motion={t.motion} />
      <Work motion={t.motion} />
      <Experience motion={t.motion} />
      <Philosophy motion={t.motion} />
      <Contact />

      <button
        className="tweaks-toggle"
        data-open={tweaksOpen}
        onClick={openTweaks}
        aria-label="Open tweaks panel"
      >
        <svg viewBox="0 0 16 16" fill="none">
          <line className="line" x1="2" y1="4" x2="14" y2="4" />
          <line className="line" x1="2" y1="8" x2="14" y2="8" />
          <line className="line" x1="2" y1="12" x2="14" y2="12" />
          <circle className="dot" cx="10" cy="4" r="2" />
          <circle className="dot" cx="5" cy="8" r="2" />
          <circle className="dot" cx="11" cy="12" r="2" />
        </svg>
        <span>tweaks</span>
      </button>

      <TweaksPanel title="tweaks">
        <TweakSection label="Theme" />
        <TweakRadio
          label="Mode"
          value={t.mode}
          options={["dark", "light"]}
          onChange={(v) => setTweak("mode", v)}
        />
        <TweakColor
          label="Accent"
          value={
            t.accentName === "Mono"
              ? t.mode === "dark" ? "#ededeb" : "#15151a"
              : (() => {
                  const a = ACCENTS.find((x) => x.name === t.accentName);
                  return `oklch(0.78 0.06 ${a?.h ?? 75})`;
                })()
          }
          options={[
            "oklch(0.78 0.06 75)",   // sand
            "oklch(0.72 0.13 40)",   // ember
            t.mode === "dark" ? "#ededeb" : "#15151a", // mono
            "oklch(0.78 0.07 250)",  // arc
            "oklch(0.78 0.07 145)",  // moss
          ]}
          onChange={(v) => {
            const map = {
              "oklch(0.78 0.06 75)": "Sand",
              "oklch(0.72 0.13 40)": "Ember",
              "oklch(0.78 0.07 250)": "Arc",
              "oklch(0.78 0.07 145)": "Moss",
            };
            setTweak("accentName", map[v] || "Mono");
          }}
        />
        <TweakSection label="Typography" />
        <TweakSelect
          label="Typeface"
          value={t.typePair}
          options={["Geist", "Inter", "Editorial"]}
          onChange={(v) => setTweak("typePair", v)}
        />
        <TweakSection label="Motion" />
        <TweakRadio
          label="Intensity"
          value={t.motion}
          options={["off", "subtle", "cinematic"]}
          onChange={(v) => setTweak("motion", v)}
        />
        <TweakSection label="Layout" />
        <TweakRadio
          label="Hero"
          value={t.heroLayout}
          options={["wide", "left", "center"]}
          onChange={(v) => setTweak("heroLayout", v)}
        />
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

    </script>
  </body>
</html>
